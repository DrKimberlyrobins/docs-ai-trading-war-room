name: Live Price Engine

on:
  workflow_dispatch:

  schedule:
    # Every 5 minutes, Monday-Friday.
    # Broad UTC window covering normal U.S. market hours
    # across daylight/standard-time changes.
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: live-price-engine
  cancel-in-progress: true

jobs:

  update-live-prices:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. VERIFY SECRET
      # ======================================================

      - name: Verify Twelve Data API key
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

        run: |

          if [ -z "$TWELVE_DATA_API_KEY" ]; then

            echo "ERROR: TWELVE_DATA_API_KEY is missing."

            exit 1

          fi

          echo "Twelve Data API key found."


      # ======================================================
      # 3. CREATE DATA DIRECTORY
      # ======================================================

      - name: Create data directory

        run: |

          mkdir -p data


      # ======================================================
      # 4. FETCH CURRENT QUOTES
      # ======================================================

      - name: Fetch live prices

        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

        run: |

          python3 <<'PY'

          import json
          import os
          import urllib.parse
          import urllib.request

          from datetime import datetime, timezone


          # ==================================================
          # SETTINGS
          # ==================================================

          API_KEY = os.environ["TWELVE_DATA_API_KEY"]


          SYMBOLS = [

              "SPY",

              "QQQ",

              "AAPL",

              "MSFT",

              "NVDA"

          ]


          # ==================================================
          # HELPERS
          # ==================================================

          def safe_float(value):

              try:

                  return float(value)

              except (TypeError, ValueError):

                  return None


          # ==================================================
          # GET ONE QUOTE
          # ==================================================

          def get_quote(symbol):

              params = urllib.parse.urlencode({

                  "symbol":
                      symbol,

                  "apikey":
                      API_KEY

              })


              url = (

                  "https://api.twelvedata.com/quote?"

                  + params

              )


              request = urllib.request.Request(

                  url,

                  headers={

                      "User-Agent":
                          "Docs-AI-Trading-War-Room-Live-Prices/1.0"

                  }

              )


              with urllib.request.urlopen(

                  request,

                  timeout=30

              ) as response:

                  return json.loads(

                      response
                      .read()
                      .decode("utf-8")

                  )


          # ==================================================
          # FETCH ALL SYMBOLS
          # ==================================================

          quotes = []

          errors = []


          for symbol in SYMBOLS:

              print()

              print(

                  "Fetching",

                  symbol

              )


              try:

                  payload = get_quote(

                      symbol

                  )


                  if payload.get("status") == "error":

                      raise ValueError(

                          payload.get(

                              "message",

                              "Unknown Twelve Data error"

                          )

                      )


                  close = safe_float(

                      payload.get("close")

                  )


                  previous_close = safe_float(

                      payload.get("previous_close")

                  )


                  open_price = safe_float(

                      payload.get("open")

                  )


                  high = safe_float(

                      payload.get("high")

                  )


                  low = safe_float(

                      payload.get("low")

                  )


                  volume = safe_float(

                      payload.get("volume")

                  )


                  percent_change = safe_float(

                      payload.get("percent_change")

                  )


                  change = safe_float(

                      payload.get("change")

                  )


                  if close is None:

                      raise ValueError(

                          "Quote did not contain a valid close/current price."

                      )


                  quote = {

                      "symbol":
                          symbol,

                      "price":
                          round(close, 4),

                      "previous_close":

                          round(

                              previous_close,

                              4

                          )

                          if previous_close is not None

                          else None,

                      "open":

                          round(

                              open_price,

                              4

                          )

                          if open_price is not None

                          else None,

                      "high":

                          round(

                              high,

                              4

                          )

                          if high is not None

                          else None,

                      "low":

                          round(

                              low,

                              4

                          )

                          if low is not None

                          else None,

                      "change":

                          round(

                              change,

                              4

                          )

                          if change is not None

                          else None,

                      "percent_change":

                          round(

                              percent_change,

                              4

                          )

                          if percent_change is not None

                          else None,

                      "volume":

                          int(volume)

                          if volume is not None

                          else None,

                      "market_date":

                          payload.get(

                              "datetime",

                              ""

                          )

                  }


                  quotes.append(

                      quote

                  )


                  print(

                      symbol,

                      "=>",

                      quote["price"]

                  )


              except Exception as exc:

                  print(

                      "ERROR:",

                      symbol,

                      str(exc)

                  )


                  errors.append({

                      "symbol":
                          symbol,

                      "message":
                          str(exc)

                  })


          # ==================================================
          # SAFETY CHECK
          # ==================================================

          if not quotes:

              raise RuntimeError(

                  "No live quotes were retrieved. Existing live-price file will not be replaced."

              )


          # ==================================================
          # OUTPUT
          # ==================================================

          output = {

              "generated_at":

                  datetime.now(

                      timezone.utc

                  ).isoformat(),

              "source":
                  "Twelve Data",

              "mode":
                  "paper",

              "engine":
                  "Doc's Live Price Engine v1",

              "update_target_minutes":
                  5,

              "quote_count":
                  len(quotes),

              "quotes":
                  quotes,

              "errors":
                  errors

          }


          with open(

              "data/live-prices.json",

              "w",

              encoding="utf-8"

          ) as file:

              json.dump(

                  output,

                  file,

                  indent=2

              )


          print()

          print(

              "================================"

          )

          print(

              "DOC'S LIVE PRICE ENGINE COMPLETE"

          )

          print(

              "================================"

          )

          print(

              "Quotes:",

              len(quotes)

          )

          print(

              "Errors:",

              len(errors)

          )

          print()

          print(

              "Saved to data/live-prices.json"

          )

          PY


      # ======================================================
      # 5. VERIFY PUBLIC FILE
      # ======================================================

      - name: Verify live price output

        run: |

          python3 <<'PY'

          import json


          with open(

              "data/live-prices.json",

              "r",

              encoding="utf-8"

          ) as file:

              data = json.load(file)


          print(

              "Engine:",

              data.get("engine")

          )


          print(

              "Generated:",

              data.get("generated_at")

          )


          print()


          for quote in data.get(

              "quotes",

              []

          ):

              print(

                  quote["symbol"],

                  "=>",

                  quote["price"]

              )

          PY


      # ======================================================
      # 6. COMMIT LIVE PRICES
      # ======================================================

      - name: Commit live prices

        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/live-prices.json


          if git diff --cached --quiet; then

            echo "No live-price changes to commit."

            exit 0

          fi


          git commit \
            -m "Update live paper prices"


          git push
